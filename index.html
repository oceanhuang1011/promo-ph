<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin PH - Fix Version</title>
    <style>
        :root {
            --gcash-blue: #0056fb;
            --gold: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', sans-serif;
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        .header-bar {
            width: 100%;
            background: rgba(0,0,0,0.85);
            color: var(--gold);
            text-align: center;
            padding: 12px 0;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 3px solid var(--gold);
        }

        .main-content {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 32px; color: var(--gold); margin: 10px 0; text-shadow: 3px 3px #000; }

        .wheel-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 20px auto;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 45px;
            background: #ff0000;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 30;
            border: 2px solid white;
        }

        #wheel {
            width: 100%;
            height: 100%;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .spin-trigger {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: white;
            border: 5px solid var(--gold);
            border-radius: 50%;
            color: #d32f2f;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            z-index: 40;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        /* 彈窗 */
        .overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .popup {
            background: white;
            width: 85%;
            max-width: 380px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            color: #333;
            border: 5px solid var(--gold);
        }

        .cta-btn {
            background: var(--gcash-blue);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .winner-ticker {
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            color: var(--gold);
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="header-bar">💎 OFFICIAL PH CASINO PROMO 2026 💎</div>

<div class="main-content">
    <h1>BIG WIN SPINS</h1>
    <p>Tap SPIN to get your ₱8,888 Jackpot!</p>

    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <button class="spin-trigger" id="spinBtn" onclick="handleSpin()">SPIN</button>
        
        <svg id="wheel" viewBox="0 0 100 100">
            <defs>
                <path id="textPath" d="M 50,50 m -37,0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" />
            </defs>
            
            <g id="sectors">
                <path d="M50,50 L50,2 A48,48 0 0,1 84,16 Z" fill="#d32f2f" />
                <path d="M50,50 L84,16 A48,48 0 0,1 98,50 Z" fill="#0056fb" />
                <path d="M50,50 L98,50 A48,48 0 0,1 84,84 Z" fill="#d32f2f" />
                <path d="M50,50 L84,84 A48,48 0 0,1 50,98 Z" fill="#0056fb" />
                <path d="M50,50 L50,98 A48,48 0 0,1 16,84 Z" fill="#d32f2f" />
                <path d="M50,50 L16,84 A48,48 0 0,1 2,50 Z" fill="#0056fb" />
                <path d="M50,50 L2,50 A48,48 0 0,1 16,16 Z" fill="#d32f2f" />
                <path d="M50,50 L16,16 A48,48 0 0,1 50,2 Z" fill="#0056fb" />
            </g>

            <text fill="white" font-size="4.5" font-weight="bold">
                <textPath href="#textPath" startOffset="6.25%">JACKPOT</textPath>
                <textPath href="#textPath" startOffset="18.75%">₱100 FREE</textPath>
                <textPath href="#textPath" startOffset="31.25%">MAX WIN</textPath>
                <textPath href="#textPath" startOffset="43.75%">TRY AGAIN</textPath>
                <textPath href="#textPath" startOffset="56.25%">₱888 BONUS</textPath>
                <textPath href="#textPath" startOffset="68.75%">200% MATCH</textPath>
                <textPath href="#textPath" startOffset="81.25%">SPIN AGAIN</textPath>
                <textPath href="#textPath" startOffset="93.75%">NO LUCK</textPath>
            </text>
        </svg>
    </div>

    <div class="winner-ticker" id="ticker">🔥 Loading winners...</div>
</div>

<div class="overlay" id="overlay">
    <div class="popup">
        <h2>YOU WON! 🎉</h2>
        <p style="font-size: 24px; font-weight: 900; color: #0056fb; margin: 20px 0;">₱8,888 JACKPOT BONUS</p>
        <p>Claim expires in: <span id="timer" style="color:red; font-weight:bold;">05:00</span></p>
        <a href="https://gr6eh.taya1225.fun/" class="cta-btn">CLAIM VIA GCASH</a>
    </div>
</div>

<script>
    function handleSpin() {
        const wheel = document.getElementById('wheel');
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        
        // 必中第一格 JACKPOT (角度調整)
        const totalDeg = 3600 + 0; 
        wheel.style.transform = `rotate(${totalDeg}deg)`;

        setTimeout(() => {
            document.getElementById('overlay').style.display = 'flex';
            startTimer(300);
        }, 5500);
    }

    function startTimer(duration) {
        let timer = duration, mins, secs;
        setInterval(() => {
            mins = parseInt(timer / 60, 10);
            secs = parseInt(timer % 60, 10);
            document.getElementById('timer').textContent = 
                (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
            if (--timer < 0) timer = 0;
        }, 1000);
    }
</script>
</body>
</html>
